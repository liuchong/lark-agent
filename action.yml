name: Lark workflow notification
description: Send trusted GitHub workflow facts to Lark or run a smart command without starting a second event listener
inputs:
  mode:
    description: notify for ordinary GitHub notification, run for a smart command
    required: false
    default: notify
  lark_app_id:
    description: Lark application ID
    required: true
  lark_app_secret:
    description: Lark application secret from a protected GitHub Environment
    required: true
  lark_chat_id:
    description: Exact destination Lark chat ID
    required: false
  github_token:
    description: GitHub token, normally github.token
    required: true
  lark_base_url:
    description: Explicit Lark or Feishu OpenAPI base URL
    required: true
  prompt_file:
    description: Workspace-relative smart-command prompt file
    required: false
    default: ""
  rules_file:
    description: Workspace-relative extra rules file
    required: false
    default: ""
  allowed_actions:
    description: Comma-separated smart-command write tools
    required: false
    default: ""
  dry_run:
    description: Deny every write tool when true
    required: false
    default: "false"
  message:
    description: Inline smart-command message
    required: false
    default: ""
  output_language:
    description: Outward language for generated content, auto, zh-CN or en-US
    required: false
    default: ""
  model_reasoning_effort:
    description: Reasoning effort for the primary model profile, such as high
    required: false
    default: ""
  model_timeout:
    description: Per-attempt model timeout as a Go duration, such as 180s
    required: false
    default: ""
outputs:
  changelog:
    description: Changelog text written by the write_job_output smart-command tool
runs:
  using: docker
  image: Dockerfile
  env:
    LARK_AGENT_MODE: ${{ inputs.mode }}
    LARK_AGENT_APP_ID: ${{ inputs.lark_app_id }}
    LARK_AGENT_APP_SECRET: ${{ inputs.lark_app_secret }}
    LARK_AGENT_LARK_BASE_URL: ${{ inputs.lark_base_url }}
    LARK_CHAT_ID: ${{ inputs.lark_chat_id }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    LARK_AGENT_PROMPT_FILE: ${{ inputs.prompt_file }}
    LARK_AGENT_RULES_FILE: ${{ inputs.rules_file }}
    LARK_AGENT_ALLOWED_ACTIONS: ${{ inputs.allowed_actions }}
    LARK_AGENT_DRY_RUN: ${{ inputs.dry_run }}
    LARK_AGENT_MESSAGE: ${{ inputs.message }}
    LARK_AGENT_OUTPUT_LANGUAGE: ${{ inputs.output_language }}
    LARK_AGENT_MODEL_REASONING_EFFORT: ${{ inputs.model_reasoning_effort }}
    LARK_AGENT_MODEL_TIMEOUT: ${{ inputs.model_timeout }}
