name: Lark Agent merge check

on:
  pull_request:
    types: [opened]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  gate:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lark-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          mode: run
          lark_app_id: ${{ vars.LARK_APP_ID }}
          lark_app_secret: ${{ secrets.LARK_APP_SECRET }}
          lark_base_url: ${{ vars.LARK_BASE_URL }}
          github_token: ${{ github.token }}
          prompt_file: .github/lark-agent/prompts/merge-check.md
          allowed_actions: upsert_github_check
          output_language: en-US
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
