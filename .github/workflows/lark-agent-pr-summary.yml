name: Lark Agent pull request summary

on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  summary:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lark-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          mode: run
          lark_app_id: ${{ vars.LARK_APP_ID }}
          lark_app_secret: ${{ secrets.LARK_APP_SECRET }}
          lark_chat_id: ${{ vars.LARK_CHAT_ID }}
          lark_base_url: ${{ vars.LARK_BASE_URL }}
          github_token: ${{ github.token }}
          prompt_file: .github/lark-agent/prompts/pr-summary.md
          allowed_actions: post_github_comment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
