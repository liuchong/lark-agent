name: Lark Agent comment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read
  checks: write

jobs:
  comment:
    if: contains(github.event.comment.body, '@lark-agent') && github.event.comment.user.type != 'Bot' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    environment: lark-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          mode: run
          lark_app_id: ${{ vars.LARK_APP_ID }}
          lark_app_secret: ${{ secrets.LARK_APP_SECRET }}
          lark_chat_id: ${{ vars.LARK_CHAT_ID }}
          lark_base_url: ${{ vars.LARK_BASE_URL }}
          github_token: ${{ github.token }}
          prompt_file: .github/lark-agent/prompts/ask.md
          allowed_actions: post_github_comment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
