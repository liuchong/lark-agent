name: Lark Agent notify style

# A failed CI run, which is the one CI outcome worth explaining in prose. Every
# completion, including green ones, is already reported once by the deterministic
# notifier.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    environment: lark-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          mode: run
          lark_app_id: ${{ vars.LARK_APP_ID }}
          lark_app_secret: ${{ secrets.LARK_APP_SECRET }}
          lark_chat_id: ${{ vars.LARK_CHAT_ID }}
          lark_base_url: ${{ vars.LARK_BASE_URL }}
          github_token: ${{ github.token }}
          prompt_file: .github/lark-agent/prompts/notify-style.md
          allowed_actions: send_lark_message
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
