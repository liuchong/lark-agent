name: Lark Agent notify style

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_run:
    workflows: [Notify Lark after CI]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI')
    runs-on: ubuntu-latest
    environment: lark-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          mode: run
          lark_app_id: ${{ vars.LARK_APP_ID }}
          lark_app_secret: ${{ secrets.LARK_APP_SECRET }}
          lark_chat_id: ${{ vars.LARK_CHAT_ID }}
          lark_base_url: ${{ vars.LARK_BASE_URL }}
          github_token: ${{ github.token }}
          prompt_file: .github/lark-agent/prompts/notify-style.md
          allowed_actions: send_lark_message
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
