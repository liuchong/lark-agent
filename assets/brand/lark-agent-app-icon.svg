  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#background)"/>
  <g filter="url(#shadow)" transform="translate(52 94) scale(1.75)">
    <path fill="#FFFFFF" d="M91 72c58 38 113 58 169 61 59 3 106 29 121 79 38-22 83-15 103 18-42 6-66 32-86 78-31 73-94 116-179 124 24-20 43-42 56-67-84 8-151-37-172-119 36 31 79 46 129 42-76-20-125-77-139-165-3-18-3-35-2-51Z"/>
